<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wireframe Atlas</title>
<meta name="description" content="A live 3D wireframe of America, growing state by state. Every street drawn as light.">
<link rel="stylesheet" href="vendor/maplibre-gl.css?v=1">
<style>
  :root{
    --cyan:#7fe7ff; --cyan-dim:#1f6b7d; --amber:#ffb14e; --ink:#bfefff;
  }
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  #map{position:absolute;inset:0;background:#000}
  .hud{
    position:absolute;z-index:10;pointer-events:none;
    font:11px/1.5 "SF Mono",ui-monospace,Menlo,monospace;color:var(--ink);
    text-shadow:0 0 6px rgba(127,231,255,.6);
  }
  #title{top:14px;left:16px;letter-spacing:.35em;font-size:13px}
  #title b{color:var(--amber);text-shadow:0 0 8px rgba(255,177,78,.7)}
  #title span{display:block;letter-spacing:.18em;font-size:9px;opacity:.65;margin-top:2px}
  #readout{bottom:12px;left:16px;font-size:10px;opacity:.75;letter-spacing:.08em}
  #ctrl{position:absolute;top:14px;right:14px;z-index:11;display:flex;flex-direction:column;gap:8px}
  #ctrl button{
    width:38px;height:38px;background:rgba(0,10,14,.72);color:var(--cyan);
    border:1px solid rgba(127,231,255,.45);border-radius:6px;cursor:pointer;
    font:12px "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.05em;
    text-shadow:0 0 6px rgba(127,231,255,.6);box-shadow:0 0 10px rgba(127,231,255,.12);
    -webkit-tap-highlight-color:transparent;
  }
  #ctrl button:hover{border-color:var(--cyan);box-shadow:0 0 14px rgba(127,231,255,.35)}
  #ctrl button.on{color:var(--amber);border-color:rgba(255,177,78,.7);text-shadow:0 0 8px rgba(255,177,78,.7)}
  .maplibregl-ctrl-attrib{background:rgba(0,0,0,.6)!important;color:#5c8a96!important;font-size:10px!important}
  .maplibregl-ctrl-attrib a{color:#5c8a96!important}
  #loading{
    position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#000;color:var(--cyan);font:12px "SF Mono",ui-monospace,Menlo,monospace;
    letter-spacing:.3em;transition:opacity .8s;text-shadow:0 0 8px rgba(127,231,255,.6);
  }
  #loading.gone{opacity:0;pointer-events:none}
  #search{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:12;width:min(420px,66vw)}
  #q{width:100%;box-sizing:border-box;background:rgba(0,10,14,.78);color:#d8f4ff;
    border:1px solid rgba(127,231,255,.45);border-radius:6px;outline:none;
    font:12px "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.1em;padding:9px 12px;
    text-transform:uppercase}
  #q::placeholder{color:#3f7d8f}
  #q:focus{border-color:#7fe7ff;box-shadow:0 0 14px rgba(127,231,255,.25)}
  #results{margin-top:6px;background:rgba(0,8,12,.93);border:1px solid rgba(127,231,255,.3);
    border-radius:6px;max-height:46vh;overflow:auto}
  .res{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;
    font:11px "SF Mono",ui-monospace,Menlo,monospace;color:#bfefff;align-items:baseline}
  .res b{font-weight:normal;color:#e8f8ff;text-shadow:0 0 6px rgba(127,231,255,.4)}
  .res .rk{font-size:9px;letter-spacing:.18em;white-space:nowrap}
  .res:hover,.res.sel{background:rgba(127,231,255,.12)}
  .pulse{width:18px;height:18px;border-radius:50%;border:2px solid #7fe7ff;
    box-shadow:0 0 12px #7fe7ff;animation:pw 1.4s ease-out infinite}
  @keyframes pw{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.4);opacity:0}}
  @media (max-width:640px){#search{top:52px;width:min(420px,88vw)}}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">ACQUIRING GRID&hellip;</div>
<div class="hud" id="title">WIREFRAME <b>ATLAS</b><span>USA GRID &middot; OSM LIVE TRACE</span></div>
<div class="hud" id="readout"></div>
<div id="search">
  <input id="q" type="search" placeholder="Search the grid" autocomplete="off" spellcheck="false">
  <div id="results" hidden></div>
</div>
<div id="ctrl">
  <button id="b3d" title="Toggle 3D tilt">3D</button>
  <button id="bnorth" title="Face north">N</button>
  <button id="bhome" title="Return to downtown">&#8982;</button>
</div>
<script src="vendor/maplibre-gl.js?v=1"></script>
<script src="vendor/pmtiles.js?v=1"></script>
<script>
const BASE = location.origin + location.pathname.replace(/[^/]*$/, "");
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const majors = ["motorway","motorway_link","trunk","trunk_link"];
const primaries = ["primary","primary_link"];
const secondaries = ["secondary","secondary_link"];
const tertiaries = ["tertiary","tertiary_link","residential","unclassified","living_street"];

const roadColor = ["match", ["get","highway"],
  majors, "#ffb14e",
  primaries, "#8fe9ff",
  secondaries, "#55c4de",
  tertiaries, "#20748a",
  "#123d49"];

const roadWidth = ["interpolate", ["exponential", 1.6], ["zoom"],
  5,  ["match", ["get","highway"], majors, .7, .4],
  8,  ["match", ["get","highway"], majors, 1.4, primaries, .8, .5],
  12, ["match", ["get","highway"], majors, 2.6, primaries, 1.8, secondaries, 1.4, .8],
  16, ["match", ["get","highway"], majors, 8, primaries, 6, secondaries, 5, tertiaries, 3.5, 2]];

const bldgHeight = ["max", 4,
  ["case",
    ["has","height"], ["to-number", ["get","height"], 0],
    ["has","building:levels"], ["*", ["to-number", ["get","building:levels"], 0], 3.2],
    5]];

const style = {
  version: 8,
  glyphs: BASE + "fonts/{fontstack}/{range}.pbf",
  sources: {
    atl: { type: "vector", url: "pmtiles://" + BASE + "atl.pmtiles?v=5" },
    ne: { type: "vector", url: "pmtiles://" + BASE + "boundaries.pmtiles?v=1" }
  },
  layers: [
    { id:"bg", type:"background", paint:{ "background-color":"#000000" } },
    { id:"ne-lakes", type:"fill", source:"ne", "source-layer":"lakes", maxzoom:9,
      paint:{ "fill-color":"#04161f" } },
    { id:"ne-coast", type:"line", source:"ne", "source-layer":"coast", maxzoom:10,
      paint:{ "line-color":"#1d5a70",
        "line-width":["interpolate",["linear"],["zoom"],3,.8,8,1.6],
        "line-opacity":["interpolate",["linear"],["zoom"],7.5,.9,9.5,0] } },
    { id:"ne-borders", type:"line", source:"ne", "source-layer":"borders", maxzoom:10,
      paint:{ "line-color":"#174a5c",
        "line-width":["interpolate",["linear"],["zoom"],3,.7,8,1.3],
        "line-opacity":["interpolate",["linear"],["zoom"],3,.55,7.5,.55,9.5,0] } },
    { id:"ne-statelines", type:"line", source:"ne", "source-layer":"statelines", maxzoom:10,
      paint:{ "line-color":"#123d49",
        "line-width":["interpolate",["linear"],["zoom"],3,.5,8,1.2],
        "line-opacity":["interpolate",["linear"],["zoom"],3,.5,7.5,.5,9.5,0],
        "line-dasharray":[4,2] } },
    { id:"water", type:"fill", source:"atl", "source-layer":"water",
      paint:{ "fill-color":"#04161f", "fill-outline-color":"#11566d" } },
    { id:"waterway", type:"line", source:"atl", "source-layer":"waterway",
      paint:{ "line-color":"#11566d", "line-width":["interpolate",["linear"],["zoom"],9,.5,15,2] } },

    { id:"park", type:"fill", source:"atl", "source-layer":"parks",
      paint:{ "fill-color":"rgba(28,94,62,.16)" } },
    { id:"park-line", type:"line", source:"atl", "source-layer":"parks",
      paint:{ "line-color":"#2f8f66", "line-opacity":.45,
        "line-width":["interpolate",["linear"],["zoom"],10,.4,16,1.4] } },

    { id:"bldg", type:"fill-extrusion", source:"atl", "source-layer":"buildings", minzoom:13,
      paint:{
        "fill-extrusion-color":["interpolate",["linear"], bldgHeight,
          4,"#07242e", 25,"#0d3644", 80,"#155466", 200,"#1f7c94"],
        "fill-extrusion-height": bldgHeight,
        "fill-extrusion-opacity":.92,
        "fill-extrusion-vertical-gradient":true } },
    { id:"bldg-line", type:"line", source:"atl", "source-layer":"buildings", minzoom:14,
      paint:{ "line-color":"#2fa8c9",
        "line-opacity":["interpolate",["linear"],["zoom"],14,.25,16,.8],
        "line-width":.6 } },

    { id:"rail", type:"line", source:"atl", "source-layer":"rails",
      filter:["has","railway"],
      paint:{ "line-color":"#8f9bff", "line-opacity":.55,
        "line-dasharray":[3,2],
        "line-width":["interpolate",["linear"],["zoom"],9,.6,15,2] } },
    { id:"aero", type:"line", source:"atl", "source-layer":"rails",
      filter:["has","aeroway"],
      paint:{ "line-color":"#dff6ff",
        "line-opacity":["match",["get","aeroway"],"runway",.9,.45],
        "line-width":["interpolate",["exponential",1.6],["zoom"],
          9, ["match",["get","aeroway"],"runway",1.5,.5],
          15,["match",["get","aeroway"],"runway",14,3]] } },

    { id:"road-glow", type:"line", source:"atl", "source-layer":"roads",
      filter:["in", ["get","highway"], ["literal", majors.concat(primaries)]],
      paint:{ "line-color": roadColor, "line-width":["interpolate",["exponential",1.6],["zoom"],8,3,16,16],
        "line-blur":6, "line-opacity":.35 } },
    { id:"road", type:"line", source:"atl", "source-layer":"roads",
      paint:{ "line-color": roadColor, "line-width": roadWidth,
        "line-opacity":["interpolate",["linear"],["zoom"],8,.85,14,1] } },

    { id:"road-label", type:"symbol", source:"atl", "source-layer":"roads", minzoom:14,
      filter:["has","name"],
      layout:{ "symbol-placement":"line", "text-field":["get","name"],
        "text-font":["Noto Sans Regular"], "symbol-spacing":380,
        "text-size":["interpolate",["linear"],["zoom"],14,12,17,16] },
      paint:{ "text-color":"#b8e4f2", "text-halo-color":"#000", "text-halo-width":2, "text-opacity":.95 } },

    { id:"poi-dot", type:"circle", source:"atl", "source-layer":"pois", minzoom:14.5,
      paint:{ "circle-radius":["interpolate",["linear"],["zoom"],14.5,1,17,2.4],
        "circle-color": ["case",
          ["has","shop"], "#7fe7ff",
          ["in",["get","amenity"],["literal",["restaurant","cafe","bar","pub","fast_food","food_court","ice_cream","nightclub"]]], "#ffb14e",
          ["has","tourism"], "#c9a0ff",
          "#d8f4ff"],
        "circle-opacity":["interpolate",["linear"],["zoom"],14.5,.35,16,.85] } },
    { id:"poi-label", type:"symbol", source:"atl", "source-layer":"pois", minzoom:15.5,
      layout:{ "text-field":["get","name"], "text-font":["Noto Sans Regular"],
        "text-size":["interpolate",["linear"],["zoom"],15.5,9.5,18,12],
        "text-offset":[0,.9], "text-anchor":"top", "text-optional":false,
        "text-padding":4 },
      paint:{ "text-color": ["case",
          ["has","shop"], "#9feaff",
          ["in",["get","amenity"],["literal",["restaurant","cafe","bar","pub","fast_food","food_court","ice_cream","nightclub"]]], "#ffc97e",
          ["has","tourism"], "#d7baff",
          "#e8f8ff"],
        "text-halo-color":"#000", "text-halo-width":1.5, "text-opacity":.92 } },

    { id:"park-label", type:"symbol", source:"atl", "source-layer":"parklabels", minzoom:11.5,
      layout:{ "text-field":["get","name"], "text-font":["Noto Sans Regular"],
        "text-size":["interpolate",["linear"],["zoom"],11.5,10,16,13],
        "text-letter-spacing":.12, "text-max-width":8 },
      paint:{ "text-color":"#7fd6a8", "text-halo-color":"#000", "text-halo-width":1.6, "text-opacity":.9 } },

    { id:"place-suburb", type:"symbol", source:"atl", "source-layer":"places", minzoom:11,
      filter:["in",["get","place"],["literal",["suburb","village"]]],
      layout:{ "text-field":["get","name"], "text-font":["Noto Sans Regular"],
        "text-size":10, "text-letter-spacing":.25, "text-transform":"uppercase" },
      paint:{ "text-color":"#6fb7c9", "text-halo-color":"#000", "text-halo-width":1.4, "text-opacity":.75 } },
    { id:"place-town", type:"symbol", source:"atl", "source-layer":"places", minzoom:9,
      filter:["==",["get","place"],"town"],
      layout:{ "text-field":["get","name"], "text-font":["Noto Sans Regular"],
        "text-size":12, "text-letter-spacing":.3, "text-transform":"uppercase" },
      paint:{ "text-color":"#9fdcec", "text-halo-color":"#000", "text-halo-width":1.6 } },
    { id:"place-city", type:"symbol", source:"atl", "source-layer":"places",
      filter:["==",["get","place"],"city"],
      layout:{ "text-field":["get","name"], "text-font":["Noto Sans Regular"],
        "text-size":["interpolate",["linear"],["zoom"],5,10.5,8,13,13,20], "text-letter-spacing":.4, "text-transform":"uppercase" },
      paint:{ "text-color":"#d8f4ff", "text-halo-color":"#000", "text-halo-width":2 } }
  ]
};

const map = new maplibregl.Map({
  container:"map", style, hash:true,
  center:[-84.390,33.755], zoom:10.5, pitch:0, bearing:0,
  minZoom:3, maxBounds:[[-179.9,10.0],[-50.0,74.0]],
  attributionControl:{ compact:true, customAttribution:"&copy; OpenStreetMap contributors" },
  antialias:true
});

map.on("load", ()=> { document.getElementById("loading").classList.add("gone"); map.resize(); });
// Some embedded webviews miss the initial container measurement and never fire
// ResizeObserver; re-assert the size until the canvas matches the container.
addEventListener("resize", ()=> map.resize());
(function sizeGuard(n){
  const c = map.getCanvas(), el = map.getContainer();
  if (parseInt(c.style.width||0) !== el.clientWidth || parseInt(c.style.height||0) !== el.clientHeight) map.resize();
  if (n < 20) setTimeout(()=> sizeGuard(n+1), 500);
})(0);
map.on("error", e => { const l=document.getElementById("loading");
  if(!l.classList.contains("gone")) l.textContent = "GRID FAULT — " + (e.error&&e.error.message||"unknown"); });

const readout = document.getElementById("readout");
function updateReadout(){
  const c = map.getCenter();
  readout.textContent = c.lat.toFixed(4) + " N  " + Math.abs(c.lng).toFixed(4) + " W   Z" +
    map.getZoom().toFixed(1) + "   HDG " + Math.round((map.getBearing()+360)%360) + "°";
}
map.on("move", updateReadout); updateReadout();

const b3d = document.getElementById("b3d");
b3d.onclick = ()=>{
  const on = map.getPitch() < 5;
  map.easeTo({ pitch: on?60:0, duration:900 });
  b3d.classList.toggle("on", on);
};
map.on("pitchend", ()=> b3d.classList.toggle("on", map.getPitch()>=5));
document.getElementById("bnorth").onclick = ()=> map.easeTo({ bearing:0, duration:700 });
document.getElementById("bhome").onclick = ()=> map.flyTo({ center:[-84.390,33.755], zoom:15.2, pitch:60, bearing:-17, duration:2600 });

// ---- Skeleton states: one tile file per state, discovered via manifest ----
const SKEL_LAYERS = ["water","waterway","park","park-line","bldg","bldg-line",
                     "rail","aero","road-glow","road","poi-dot","road-label",
                     "poi-label","park-label","place-suburb","place-town","place-city"];
function addStateSource(slug, v){
  const src = "st-" + slug;
  if (map.getSource(src)) return;
  map.addSource(src, { type:"vector", url:"pmtiles://" + BASE + "tiles/" + slug + ".pmtiles?v=" + v });
  const layers = map.getStyle().layers;
  SKEL_LAYERS.forEach(id => {
    const base = layers.find(l => l.id === id);
    if (!base) return;
    const c = JSON.parse(JSON.stringify(base));
    c.id = src + "-" + id; c.source = src;
    map.addLayer(c, c.type === "symbol" ? undefined : "road-label");
  });
}
fetch(BASE + "tiles/manifest.json?cb=" + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(man => {
    if (!man || !man.states) return;
    SEARCHV = man.v || SEARCHV;
    const addAll = () => man.states.forEach(s => addStateSource(s, man.v));
    if (map.isStyleLoaded()) addAll(); else map.once("load", addAll);
  }).catch(()=>{});

// ---- Search: static gzipped shards, no server, no keys ----
let SEARCHV = 2; const SH = {};
const KIND = { c:["CITY",11.8], s:["AREA",13.2], r:["STREET",15.6], k:["PARK",14.2], p:["PLACE",16.8] };
const KCOLOR = { c:"#d8f4ff", s:"#9fdcec", r:"#a8dced", k:"#7fd6a8", p:"#ffc97e" };
const snorm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
async function loadShard(ch){
  if (SH[ch]) return SH[ch];
  SH[ch] = (async ()=>{
    try{
      const r = await fetch(BASE + "search/" + ch + ".bin?v=" + SEARCHV);
      if (!r.ok) return [];
      let buf = await r.arrayBuffer();
      const u8 = new Uint8Array(buf);
      if (u8[0] === 0x1f && u8[1] === 0x8b)
        buf = await new Response(new Response(buf).body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(buf)).map(e =>
        ({ name:e[0], kind:e[1], lon:e[2], lat:e[3], n:snorm(e[0]) }));
    }catch(_){ return []; }
  })();
  return SH[ch];
}
const qEl = document.getElementById("q"), rEl = document.getElementById("results");
let hits = [], sel = -1, qTimer;
function goTo(h){
  rEl.hidden = true; qEl.blur();
  map.flyTo({ center:[h.lon,h.lat], zoom:KIND[h.kind][1], duration:2200 });
  const el = document.createElement("div"); el.className = "pulse";
  const mk = new maplibregl.Marker({ element:el }).setLngLat([h.lon,h.lat]).addTo(map);
  setTimeout(()=> mk.remove(), 7000);
}
function render(){
  rEl.innerHTML = ""; rEl.hidden = !hits.length;
  hits.forEach((h,i)=>{
    const d = document.createElement("div");
    d.className = "res" + (i===sel ? " sel" : "");
    d.innerHTML = "<b></b><span class='rk'></span>";
    d.firstChild.textContent = h.name;
    d.lastChild.textContent = KIND[h.kind][0];
    d.lastChild.style.color = KCOLOR[h.kind];
    d.onmousedown = e => { e.preventDefault(); goTo(h); };
    rEl.appendChild(d);
  });
}
async function runSearch(){
  const nq = snorm(qEl.value.trim());
  if (nq.length < 2){ hits = []; render(); return; }
  const ch = (nq[0] >= "a" && nq[0] <= "z") ? nq[0] : "0";
  const entries = await loadShard(ch);
  if (snorm(qEl.value.trim()) !== nq) return;
  const c = map.getCenter();
  hits = entries.filter(e => e.n.includes(nq))
    .map(e => ({ ...e, d: (e.lon-c.lng)*(e.lon-c.lng)*.69 + (e.lat-c.lat)*(e.lat-c.lat),
                 pre: e.n.startsWith(nq) ? 0 : 1 }))
    .sort((a,b)=> a.pre-b.pre || a.d-b.d).slice(0,12);
  sel = -1; render();
}
qEl.addEventListener("input", ()=>{ clearTimeout(qTimer); qTimer = setTimeout(runSearch, 130); });
qEl.addEventListener("keydown", e=>{
  if (e.key === "ArrowDown"){ sel = Math.min(sel+1, hits.length-1); render(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ sel = Math.max(sel-1, -1); render(); e.preventDefault(); }
  else if (e.key === "Enter" && hits.length){ goTo(hits[Math.max(sel,0)]); }
  else if (e.key === "Escape"){ rEl.hidden = true; qEl.blur(); }
});
qEl.addEventListener("focus", ()=>{ if (hits.length) rEl.hidden = false; });
qEl.addEventListener("blur", ()=> setTimeout(()=>{ rEl.hidden = true; }, 150));
</script>
</body>
</html>
